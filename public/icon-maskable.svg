<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <linearGradient id="emeraldGradMask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable cropping -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inside safe zone: Central 80% circle (radius ~180px) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1f242d" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#262b35" stroke-width="2" />

  <!-- Tactical Drop Box scaled nicely inside safe zone -->
  <g filter="url(#glowMask)">
    <!-- Hexagon -->
    <path d="M 256 140 L 350 195 L 350 305 L 256 360 L 162 305 L 162 195 Z" 
          fill="#13171f" stroke="url(#emeraldGradMask)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Vault Box -->
    <rect x="215" y="235" width="82" height="66" rx="12" fill="#090a0c" stroke="#34d399" stroke-width="4.5" />
    <!-- Lock Shackle -->
    <path d="M 231 235 V 210 A 25 25 0 0 1 281 210 V 235" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="256" cy="263" r="6" fill="#34d399" />
    <polygon points="253,266 259,266 261,280 251,280" fill="#34d399" />
  </g>
</svg>
