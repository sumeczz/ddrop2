<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262b35" stroke-width="3" />

  <!-- Radar / Target rings (tactical aesthetic) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f242d" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#262b35" stroke-width="2" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="96" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="456" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="96" y2="256" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <line x1="416" y1="256" x2="456" y2="256" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Tactical Geolocation Drop Box -->
  <g filter="url(#glow)">
    <!-- Outer Hexagon / Shield Marker -->
    <path d="M 256 120 L 370 186 L 370 318 L 256 384 L 142 318 L 142 186 Z" 
          fill="#13171f" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Inner Box / Vault Icon -->
    <rect x="206" y="230" width="100" height="80" rx="14" fill="#090a0c" stroke="#34d399" stroke-width="5" />
    <!-- Lock Shackle -->
    <path d="M 226 230 V 200 A 30 30 0 0 1 286 200 V 230" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="256" cy="265" r="7" fill="#34d399" />
    <polygon points="253,268 259,268 261,286 251,286" fill="#34d399" />

    <!-- Signal Pings -->
    <circle cx="256" cy="155" r="5" fill="#10b981" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 40 100 V 40 H 100" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M 472 100 V 40 H 412" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M 40 412 V 472 H 100" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M 472 412 V 472 H 412" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
</svg>
